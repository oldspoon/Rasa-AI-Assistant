# Guard rails
- story: e2e - extra - asks schedule without introducing (guard)
  steps:
    - action: action_listen
    - user: "What days do I have lectures?"
      intent: ask_lecture_days
    - action: action_answer_lecture_days

- story: e2e - extra - out of scope question
  steps:
    - action: action_listen
    - user: "Tell me a joke"
      intent: out_of_scope
    - action: utter_out_of_scope
