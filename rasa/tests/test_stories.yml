version: "3.1"

# End-to-end stories. Run: rasa test core --e2e --stories tests/test_stories.yml
# Entities are inline, e.g. [Alice](first_name). Custom actions are not run,
# so only intents and actions are checked. slot_was_set mirrors the runtime name slots.

stories:

# Alice Johnson: lecture student, happy path
- story: e2e - conversation 1 - Alice Johnson full lecture flow
  steps:
    - action: action_listen
    - user: "Hello"
      intent: greet
    - action: utter_greet
    - action: action_listen
    - user: "My name is [Alice](first_name) [Johnson](last_name)"
      intent: introduce_self
    - slot_was_set:
        - first_name: "Alice"
        - last_name: "Johnson"
    - action: action_lookup_student
    - action: action_listen
    - user: "What days do I have lectures?"
      intent: ask_lecture_days
    - action: action_answer_lecture_days
    - action: action_listen
    - user: "Which campus am I at?"
      intent: ask_campus
    - action: action_answer_campus
    - action: action_listen
    - user: "What time is my session?"
      intent: ask_time
    - action: action_answer_time
    - action: action_listen
    - user: "What subject do I have?"
      intent: ask_subject
    - action: action_answer_subject
    - action: action_listen
    - user: "What room am I in?"
      intent: ask_room
    - action: action_answer_room
    - action: action_listen
    - user: "Give me all my details"
      intent: ask_all_details
    - action: action_answer_all_details
    - action: action_listen
    - user: "Goodbye"
      intent: goodbye
    - action: utter_goodbye

