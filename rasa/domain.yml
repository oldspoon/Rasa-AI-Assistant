version: "3.1"

intents:
  - greet
  - goodbye
  - thank_you
  - introduce_self
  - ask_lecture_days
  - ask_practical_days
  - ask_campus
  - ask_time
  - ask_subject
  - ask_room
  - ask_all_details
  - ask_explain
  - ask_parking_arrears
  - pay_by_phone
  - pay_at_infodesk
  - out_of_scope

entities:
  - first_name
  - last_name

slots:
  first_name:
    type: text
    mappings:
      - type: from_entity
        entity: first_name

  last_name:
    type: text
    mappings:
      - type: from_entity
        entity: last_name

responses:
  utter_greet:
    - text: "Hello! I'm Octopi, your Campus Attendance Assistant. Welcome to the Campus Attendance System. Ask me about your schedule - lecture or practical days, campus, time, subject or room. If I don't know you yet, tell me your first and last name (e.g. 'My name is Alice Johnson')."

  utter_goodbye:
    - text: "Goodbye! Have a great session on campus!"

  utter_youre_welcome:
    - text: "You're welcome! Let me know if you need anything else about your schedule."

  utter_ask_name:
    - text: "Could you please provide your first name and last name?"

  utter_student_not_found:
    - text: "I'm sorry, I couldn't find a student with the name {first_name} {last_name} in our attendance records. Please check your name and try again."

  utter_student_found:
    - text: "Great! I found your record, {first_name} {last_name}. You can now ask me about your schedule. For example: 'What days do I have lectures?', 'What days do I have practicals?', or 'Give me all my schedule details.'"

  utter_no_student_loaded:
    - text: "It seems I don't have your information yet. Please introduce yourself first by telling me your first name and last name."

  utter_out_of_scope:
    - text: "I'm sorry, I can only help with campus attendance and schedule information. Please ask me something related to your timetable."

  utter_explain:
    - text: "I'm Octopi, the Campus Attendance Assistant - a chatbot that looks up your attendance records. You can ask me about your lecture or practical days, campus, time, subject and room. To get started, tell me your first and last name (e.g. 'My name is Alice Johnson'), then just type or dictate a question like 'What days do I have lectures?', 'What time is my practical?', or 'Give me all my schedule details'."

  utter_default:
    - text: "I didn't quite understand that. You can ask me about your lecture or practical days, campus location, time, subject, or room number."

  utter_pay_by_phone:
    - text: "To pay by phone, call the parking payment line on **020 7946 0321**. Have your vehicle's licence plate and the date of the charge ready."

  utter_visit_infodesk:
    - text: "To pay in person, visit the **InfoDesk** on your campus. Bring your vehicle's licence plate and the date of the charge."

  utter_parking_unavailable:
    - text: "I couldn't check your parking arrears just now. Please try again in a moment."

actions:
  - action_lookup_student
  - action_answer_lecture_days
  - action_answer_practical_days
  - action_answer_campus
  - action_answer_time
  - action_answer_subject
  - action_answer_room
  - action_answer_all_details
  - action_check_parking_arrears

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
