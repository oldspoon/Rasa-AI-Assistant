version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Respond politely to a thank you
  steps:
    - intent: thank_you
    - action: utter_youre_welcome

- rule: Respond to questions outside the bot's scope
  steps:
    - intent: out_of_scope
    - action: utter_out_of_scope

- rule: Explain what the bot is and how to use it
  steps:
    - intent: ask_explain
    - action: utter_explain

- rule: Ask the user to rephrase when NLU confidence is low
  steps:
    - intent: nlu_fallback
    - action: utter_default

- rule: Give the pay-by-phone details
  steps:
    - intent: pay_by_phone
    - action: utter_pay_by_phone

- rule: Say how to pay at the InfoDesk
  steps:
    - intent: pay_at_infodesk
    - action: utter_visit_infodesk
