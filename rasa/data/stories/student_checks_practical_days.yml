# Student introduces, is found, then asks for practical days
version: "3.1"

stories:
- story: student checks practical days
  steps:
    - intent: greet
    - action: utter_greet
    - intent: introduce_self
      entities:
        - first_name: "Bob"
        - last_name: "Smith"
    - action: action_lookup_student
    - intent: ask_practical_days
    - action: action_answer_practical_days
