# Greeting, then introduction, then all details
version: "3.1"

stories:
- story: greet then introduce and check all
  steps:
    - intent: greet
    - action: utter_greet
    - intent: introduce_self
      entities:
        - first_name: "Katie"
        - last_name: "Taylor"
    - action: action_lookup_student
    - intent: ask_all_details
    - action: action_answer_all_details
    - intent: goodbye
    - action: utter_goodbye
