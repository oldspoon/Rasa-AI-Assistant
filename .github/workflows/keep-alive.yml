name: Keep the hosted bot awake

on:
  schedule:
    # Ping daily: free Spaces sleep after 48h idle.
    - cron: "17 6 * * *"
    # Monthly commit: GitHub stops schedules after 60 idle days.
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    if: github.event.schedule != '0 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Wake the Rasa Space and report its status
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 --retry 2 --retry-delay 20 \
            https://oldspoon-rasa-attendance-bot.hf.space/version || true)
          echo "Rasa Space responded with HTTP $code"

  heartbeat:
    if: github.event.schedule == '0 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep the repository active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: monthly activity heartbeat"
          git push
